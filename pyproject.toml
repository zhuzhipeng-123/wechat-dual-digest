[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-dual-digest"
version = "0.1.0"
description = "Local Windows WeChat practice and recruitment digest MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4==4.14.3",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "jsonschema==4.25.1",
  "playwright==1.63.0",
  "rapidocr-onnxruntime==1.4.4",
  "tzdata==2026.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.8",
]

[project.scripts]
wechat-digest = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
